          excerpt: Meeting the growing demand for Llama would not be possible without the roster of partners we have across the hardware and software ecosystem, including Amazon Web Services (AWS), AMD, Microsoft’s Azure, Databricks, Dell, Google Cloud, Groq,
      - topic: usage
        heading: Growing adoption by enterprises and governments
        records: []
        text: As more people turn to our open models, we’ve released new features that make building on Llama a more standardized experience. This year, we developed Llama Stack, an interface for canonical toolchain components to customize Llama models and build agentic applications. We believe that offering the best simplified tool for building with Llama will only accelerate the incredible adoption we’ve already witnessed across sectors.
