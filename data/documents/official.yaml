        - huggingface:model:black-forest-labs/FLUX.2-dev
        text: "FLUX.2 [dev]: 32B open-weight model, derived from the FLUX.2 base model. The most powerful open-weight image generation and editing model available today, combining text-to-image synthesis and image editing with multiple input images in a single checkpoint. FLUX.2 [dev] weights are available on Hugging Face and can now be used locally using our reference inference code. On consumer grade GPUs like GeForce RTX GPUs you can use an optimized fp8 reference implementation of FLUX.2 [dev], created in collaboration with NVIDIA and ComfyUI. You can also sample Flux.2 [dev] via API endpoints on FAL, Replicate, Runware, Verda, TogetherAI, Cloudflare, DeepInfra. For a commercial license, visit our website."
        evidence:
          locator: css:html:nth-child(1) > body:nth-child(2) > main:nth-child(4) > article:nth-child(1) > div:nth-child(3) > div:nth-child(2) > ul:nth-child(15) > li:nth-child(3)
