        heading: Things to know
        records: []
        text: Things to know Amazon Nova models are available in Amazon Bedrock in the US East (N. Virginia) AWS Region. Amazon Nova Micro, Lite, and Pro are also available in the US West (Oregon), and US East (Ohio) Regions via cross-Region inference. As usual with Amazon Bedrock, the pricing follows a pay-as-you-go model. For more information, see Amazon Bedrock pricing.
