      passages:
      - topic: overview
        heading: An incredible year for Llama
        records: []
        text: The growth of Llama, our open large language model, was exponential this year thanks to a rapid drumbeat of innovation and the open approach we take to sharing updates with the AI community. We started the year by introducing Llama 3, the next generation of our state-of-the-art open large language model. We followed that in July with Llama 3.1, which included the release of 405B, the first frontier-level open AI model. Keeping up the pace of innovation, we announced Llama 3.2 at Connect 2024, sharing our first ever multimodal models, as well as small and medium-sized and lightweight, text-only models that fit onto edge and mobile devices. And to close out the year, we released Llama 3.3 70B, a text-only model that offers similar performance as the 3.1 405B at a fraction of the serving cost.
        evidence:
          locator: css:html:nth-child(1) > body:nth-child(2) > div:nth-child(2) > div:nth-child(1) > div:nth-child(2) > div:nth-child(1) > div:nth-child(3) > div:nth-child(1) > div:nth-child(5) > p:nth-child(1)
          excerpt: The growth of Llama, our open large language model, was exponential this year thanks to a rapid drumbeat of innovation and the open approach we take to sharing updates with the AI community. We started the year by introducing Llama 3 , the
      - topic: availability
        heading: An incredible year for Llama
        records: []
        text: Meeting the growing demand for Llama would not be possible without the roster of partners we have across the hardware and software ecosystem, including Amazon Web Services (AWS), AMD, Microsoft’s Azure, Databricks, Dell, Google Cloud, Groq, NVIDIA, IBM watsonx, Oracle Cloud, ScaleAI, Snowflake, and more. This growing set of partners represents the best of the AI technology ecosystem and ensures Llama is optimized to run in virtually any environment and in any form, including on-device and on-premises, as well as managed service APIs from our cloud partners. Llama usage by monthly token volume has continued to make tremendous progress, with monthly token volume on key cloud partners growing over 50% month-over-month in September.
        evidence:
