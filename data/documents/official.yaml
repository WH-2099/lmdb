          excerpt: >-
            Today, we’re thrilled to announce Amazon Nova , a new generation of
            state-of-the-art foundation models (FMs) that deliver frontier intelligence and industry
            leading price performance, available exclusively in Amazon Bedrock .
      - topic: capabilities
        heading: "Understanding models: Text and visual intelligence"
        records:
        - modelsdev:model:amazon/nova-pro
        - modelsdev:model:amazon/nova-pro-v1
        text: >-
          Amazon Nova Pro – A highly capable multimodal model with the best combination
          of accuracy, speed, and cost for a wide range of tasks. Amazon Nova Pro is capable
          of processing up to 300K input tokens and sets new standards in multimodal
          intelligence and agentic workflows that require calling APIs and tools to complete
          complex workflows. It achieves state-of-the-art performance on key benchmarks
          including visual question answering (TextVQA) and video understanding (VATEX). Amazon
          Nova Pro demonstrates strong capabilities in processing both visual and textual
          information and excels at analyzing financial documents. With an input context of
          300K tokens, it can process code bases with over fifteen thousand lines of code.
          Amazon Nova Pro also serves as a teacher model to distill custom variants of
          Amazon Nova Micro and Lite.
        evidence:
          locator: >-
            css:html:nth-child(1) > body:nth-child(2) > div:nth-child(3) > div:nth-child(1)
            > main:nth-child(1) > article:nth-child(2) > section:nth-child(5) >
            p:nth-child(10)
          excerpt: >-
            Amazon Nova Pro – A highly capable multimodal model with the best combination
            of accuracy, speed, and cost for a wide range of tasks. Amazon Nova Pro is capable
            of processing up to 300K input tokens and sets new standards in multimodal inte
      - topic: limitations
        heading: Using Amazon Nova Pro for video analysis
        records:
        - modelsdev:model:amazon/nova-pro
        - modelsdev:model:amazon/nova-pro-v1
        text: >-
          I can use a more detailed prompt to extract specific information from the video
          such as objects or text. Note that Amazon Nova currently does not process audio
          in a video.
        evidence:
          locator: >-
            css:html:nth-child(1) > body:nth-child(2) > div:nth-child(3) > div:nth-child(1)
            > main:nth-child(1) > article:nth-child(2) > section:nth-child(5) >
            p:nth-child(31)
          excerpt: >-
            I can use a more detailed prompt to extract specific information from the video
            such as objects or text. Note that Amazon Nova currently does not process audio
            in a video.
      - topic: availability
        heading: Things to know
        records: []
        text: >-
          Things to know Amazon Nova models are available in Amazon Bedrock in the US
          East (N. Virginia) AWS Region. Amazon Nova Micro, Lite, and Pro are also available
          in the US West (Oregon), and US East (Ohio) Regions via cross-Region inference. As
          usual with Amazon Bedrock, the pricing follows a pay-as-you-go model. For more
          information, see Amazon Bedrock pricing.
        evidence:
