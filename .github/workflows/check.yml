name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Validate committed metadata
        run: cargo run --locked -- validate
      - name: Check generated schemas
        run: cargo run --locked -- schema --check
