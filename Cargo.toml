[package]
name = "model-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A reproducible model metadata registry with source evidence"
publish = false

[[bin]]
name = "lmdb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
schemars = "1.2.3"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
granit-parser = { version = "2.0.0", default-features = false, features = ["std", "error_messages"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "fs", "net", "signal"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
futures-util = "0.3"
scraper = { version = "0.27.0", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
jsonschema = { version = "0.59.0", default-features = false }

[dev-dependencies]
tempfile = "3"
